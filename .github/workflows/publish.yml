name: "🚀 publish"

on:
    push:
        branches:
          - production

permissions:
    contents: read
    id-token: write

jobs:
    release:
        name: 🚀 publish
        runs-on: ubuntu-latest
        steps:
            - name: 📚 checkout
              uses: actions/checkout@v4
            - name: 🟢 node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - name: 🧪 test
              run: npm test
            - name: 🚀 publish
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{secrets.NPM_AUTH_TOKEN}}
