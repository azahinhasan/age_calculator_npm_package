name: "🧪 test"

on:
    push:
        branches:
          - main
    pull_request:

permissions:
    contents: read

jobs:
    test:
        name: 🧪 test (node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [18, 20, 22, 24]
        steps:
            - name: 📚 checkout
              uses: actions/checkout@v4
            - name: 🟢 node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
            - name: 🧪 test
              run: npm test
